# Publishes to nuget.org using Trusted Publishing (OIDC).
# No stored API key: NuGet/login exchanges a GitHub-issued OIDC token for a
# short-lived (1 hour) API key, validated against the trusted publishing policy
# configured on nuget.org for this repository + workflow file.
#
# Trigger manually from the Actions tab (Run workflow) after bumping
# AgentNetVersion in Directory.Build.props.
#
# Mirrors the pack/test steps of build.fsx ("publish" pipeline).

name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-2022

    permissions:
      id-token: write # required for GitHub OIDC token issuance (Trusted Publishing)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tests run in Debug because DurableIdTests.getDisplayName relies on
      # reflection metadata that the Release compiler optimizes away (see build.fsx).
      - name: Test
        run: dotnet test src/AgentNet.Tests/AgentNet.Tests.fsproj

      - name: Pack
        run: |
          dotnet pack src/AgentNet/AgentNet.fsproj -c Release --output .build
          dotnet pack src/AgentNet.InProcess.Polly/AgentNet.InProcess.Polly.fsproj -c Release --output .build

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: "jordan marr" # nuget.org profile name (not email)

      - name: Push
        run: dotnet nuget push .build\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
